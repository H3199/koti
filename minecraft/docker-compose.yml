services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      SEED: 7830518263619659759	
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ../../minecraft-data:/data
